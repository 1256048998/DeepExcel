<!DOCTYPE html>
<html>
<meta charset="utf-8">
<!-- WPS 加载项入口：WPS 启动时加载这个页面，ribbon.xml 里的 OnRibbonLoad / GetImage /
     OnAction 等回调都来自 main.js。缺了它，WPS 12.1.0.29690 会自己生成一个指向
     js/main.js 的默认入口，我们的 main.js 永远不加载：选项卡在、没有图标、按钮全是死的。
     写法与金山官方 wpsjs 模板（@wps-jsapi/et/index.html）一致。 -->
<script type="text/javascript" src="./main.js"></script>
</html>
